<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex AI - Grok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/lua.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            /* Chat background color: #18181b — a very dark charcoal used for the chat UI background */
            /* subtle lightening of the chat background */
            background-color: #18181b;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Top-right circular avatar for current websim user (small, local only) */
        #user-avatar {
            position: fixed;
            top: 4px; /* moved a bit higher */
            right: 6px; /* nudged slightly more to the right */
            width: 32px; /* a touch smaller */
            height: 32px;
            border-radius: 9999px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(148,163,184,0.06);
            z-index: 120;
            pointer-events: auto;
        }
        #user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .chat-container {
            height: 100%;
            /* nudge the whole chat area slightly to the left on mobile/iframe */
            padding-left: 8px;
            padding-right: 12px;
            box-sizing: border-box;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
        }

        pre {
            /* make code blocks full-width within AI bubbles but add a subtle lighter background
               so code blocks are easier to read against the dark UI */
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.03) !important; /* subtle lighter block background */
            color: #e6eef6 !important;
            /* remove rounding on the TOP corners so only the top bar appears rounded */
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            /* keep bottom rounding to visually match wrapper when expanded */
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            padding: 1rem;
            margin: 0.5rem 0;
            border: none; /* removed outline so only the top bar remains */
            box-shadow: none;
            outline: none;
            position: relative;
            /* removed max-height so code blocks can expand naturally */
            /* removed overflow:auto so the block does not show internal scrollbars */
            /* preserve code formatting without forcing scroll; let layout expand */
            white-space: pre;
            scrollbar-width: none;
            -ms-overflow-style: none;
            /* Ensure block code uses the JetBrains Mono code font for clear monospaced rendering */
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Segoe UI Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        /* Ensure highlight.js doesn't add its own heavy background or extra padding; keep it subtle */
        .hljs {
            background: rgba(255,255,255,0.02) !important; /* very light tint to lift code from the page */
            padding: 0 !important;
        }

        pre::-webkit-scrollbar {
            display: none;
        }

        /* wrapper and top bar for code blocks */
        .code-wrapper {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            margin: 0.5rem 0;
            border-radius: 8px;
            overflow: visible; /* allow expanded code blocks to grow without being clipped */
            /* match code block visual: keep subtle background but remove border so only the bar reads as the control */
            background: rgba(255,255,255,0.03);
            border: none;
        }

        .code-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            /* align padding with code block so the bar sits flush visually */
            padding: 12px 16px;
            /* make the bar visually identical to the code block background and remove separate divider */
            background: rgba(255,255,255,0.03);
            border-bottom: none;
            /* keep the top bar rounded so only the bar shows corner radii */
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .code-bar .copy-btn {
            background: transparent;
            border: none;
            padding: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #9ca3af;
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .code-bar .copy-btn:focus {
            outline: none;
            box-shadow: none;
        }

        /* remove hover background so icon stays without colored background */
        .code-bar .copy-btn:hover {
            color: #e6eef6;
            background: transparent;
        }

        *::-webkit-scrollbar {
            display: none;
        }
        
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .message-bubble {
            max-width: 85%;
            word-wrap: break-word;
        }

        /* Ensure AI message bubbles can use the full width (override the generic max-width) */
        .ai-message.message-bubble {
            max-width: 100%;
            align-self: stretch;
            padding-left: 4px;
            padding-right: 0;
        }

        .user-message {
            background-color: #4b5563; /* changed from blue to gray */
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            width: fit-content;
            max-width: 80%;
            /* move user bubbles slightly left from the right edge for better balance */
            margin-right: 12px;
        }

        .ai-message {
            background-color: transparent;
            color: #e2e8f0;
            /* tighter left alignment so AI bubbles sit a bit more to the left */
            align-self: flex-start;
            margin-left: 0;
            max-width: 100%;
            padding-left: 2px;
            padding-right: 0;
            line-height: 1.6;
        }

        /* Inline and block code formatting for AI messages:
           - inline code (backticks) shown with professional monospaced font and clear distinction
           - preserve existing block code handling for fenced code blocks */
        .ai-message code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.04);
            color: #f1f5f9;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.78em;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* make sure inline code inside paragraphs doesn't force extra vertical spacing */
        .ai-message p code { display: inline-block; vertical-align: middle; margin: 0 2px; }

        /* keep existing block code wrapper behavior intact (fenced code blocks remain in <pre>) */
        .ai-message pre code {
            background: transparent !important;
            padding: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            font-size: 0.90em;
            /* ensure code inside pre preserves long lines and allows horizontal scroll in the parent pre */
            white-space: pre;
        }

        /* Markdown Formatting Support */
        .ai-message p { margin-bottom: 1rem; }
        .ai-message ul, .ai-message ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .ai-message ul { list-style-type: disc; }
        .ai-message ol { list-style-type: decimal; }
        .ai-message li { margin-bottom: 0.25rem; }
        .ai-message blockquote { border-left: 4px solid #3f3f46; padding-left: 1rem; font-style: italic; color: #9ca3af; margin: 1rem 0; }
        .ai-message h1 { font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0 0.75rem 0; color: #ffffff; }
        .ai-message h2 { font-size: 1.25rem; font-weight: 700; margin: 1.25rem 0 0.5rem 0; color: #ffffff; }
        .ai-message h3 { font-size: 1.1rem; font-weight: 600; margin: 1rem 0 0.5rem 0; }
        .ai-message table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
        /* darker, mid-gray outline for table cells for better contrast against the dark UI */
        .ai-message th, .ai-message td { border: 1px solid #2b2e31; padding: 0.5rem; text-align: left; }
        /* slightly darker header background to distinguish table headings without being too bright */
        .ai-message th { background-color: #202326; }
        .ai-message strong { color: #ffffff; }
        .ai-message hr {
            border: none;
            height: 2px;
            margin: 1.5rem 0;
            border-radius: 4px;
            /* neutral gray rule for markdown '---' for better contrast and less blue */
            background: linear-gradient(90deg, #2b3034 0%, #9aa5ad 50%, #2b3034 100%);
        }

        /* Subtle markdown formatting for AI thought process */
        .reasoning-content-markdown {
            font-style: italic;
        }
        .reasoning-content-markdown p { margin-bottom: 0.6rem; }
        .reasoning-content-markdown p:last-child { margin-bottom: 0; }
        .reasoning-content-markdown h1, .reasoning-content-markdown h2, .reasoning-content-markdown h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0.8rem 0 0.3rem 0;
            color: #cbd5e1;
        }
        .reasoning-content-markdown strong {
            color: #cbd5e1;
            font-weight: 600;
        }
        .reasoning-content-markdown ul, .reasoning-content-markdown ol {
            margin-bottom: 0.6rem;
            padding-left: 1.1rem;
        }
        .reasoning-content-markdown li { margin-bottom: 0.2rem; }
        .reasoning-content-markdown code {
            font-size: 0.85em;
            background: rgba(148, 163, 184, 0.1);
            border: none;
            padding: 1px 3px;
        }
        .reasoning-content-markdown pre {
            font-size: 0.85em;
            padding: 0.5rem;
            background: rgba(0,0,0,0.2) !important;
        }

        .typing-indicator {
            outline: none;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #9ca3af;
            display: inline-block;
            border-radius: 50%;
            margin-right: 2px;
            animation: bounce 1.3s linear infinite;
            box-shadow: none;
        }

        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Shimmering "processando conhecimento" inline text (no background or shadow)
           Implemented as .shimmer to match usage in JS and with a slow, subtle sweep */
        .shimmer {
            display: inline-block;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            line-height: 1.4;
            color: transparent; /* fallback: text becomes visible via parent color when gradient not supported */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(90deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.36) 50%, rgba(255,255,255,0.10) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer-slow 3.5s linear infinite;
        }

        /* Slightly slower shimmer variant for editing indicator and pencil icon */
        .shimmer-slow {
            display: inline-block;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            line-height: 1.4;
            color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(90deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.36) 50%, rgba(255,255,255,0.10) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* intentionally slower than the default shimmer to be subtly calmer */
            animation: shimmer-slow 5s linear infinite;
        }

        /* Accessibility/fallback: if background-clip:text isn't supported, keep readable color on parent .ai-message */
        .ai-message .shimmer {
            color: transparent;
        }
        .no-bgclip .shimmer { /* optional helper class if JS wants to toggle fallback */
            color: #cfd8db; /* visible off-white fallback */
            -webkit-text-fill-color: initial;
        }

        @keyframes shimmer-slow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* keep previous helper for older codebindings (.ai-processing) as a simple readable fallback */
        .ai-processing {
            color: #cbd5e1;
            font-weight: 600;
            display: inline-block;
            position: relative;
            overflow: hidden;
            line-height: 1.4;
        }

        #file-preview {
            display: none;
            padding: 6px 12px;
            position: fixed;
            left: 6px;
            bottom: 120px;
            z-index: 95;
            pointer-events: auto;
            display: flex;
            flex-wrap: nowrap;          /* place chips side-by-side */
            gap: 8px;
            max-width: calc(100% - 32px);
            overflow-x: auto;           /* enable horizontal scrolling */
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;      /* hide Firefox scrollbar */
            -ms-overflow-style: none;   /* hide IE/Edge scrollbar */
        }

        .attachment-chip {
            background: #27272a;
            border: none;
            /* slightly taller: increase vertical padding and set a minimum height for consistent touch target */
            padding: 12px 14px;
            min-height: 48px;
            border-radius: 10px;
            display: inline-flex;      /* keep chips inline for horizontal flow */
            align-items: center;
            font-size: 0.9rem;
            width: auto;
            max-width: 320px;          /* allow wider previews horizontally */
            color: #f1f5f9;
            position: relative;        /* for absolute remove button */
            padding-right: 40px;       /* give space for remove button */
            user-select: none;
            flex: 0 0 auto;            /* prevent chips from shrinking to fit */
        }

        .attachment-chip button {
            margin-left: 10px;
            color: #ffffff; /* white X for contrast */
            flex-shrink: 0;
            /* hide remove button by default; revealed on long-press */
            display: none;
            background: rgba(255,255,255,0.08); /* slightly light circular background */
            border: none;
            padding: 3px; /* slightly smaller touch area to reduce background size */
            cursor: pointer;
            position: absolute;
            right: 6px; /* moved a bit further right toward the chip edge */
            top: 2px; /* moved slightly up for better alignment */
            border-radius: 9999px; /* circular */
            font-size: 0.85rem; /* a bit smaller X glyph */
            line-height: 1;
            width: 26px; /* slightly smaller background */
            height: 26px; /* slightly smaller background */
            display: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        /* visible state for remove button (set via JS on long-press) */
        .attachment-chip.show-remove button {
            display: inline-block;
        }

        .attachment-chip i {
            margin-right: 10px;
            color: #e6eef6;
            font-size: 1.25rem;
        }

        .attachment-chip span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .attachment-chip button {
            margin-left: 10px;
            color: #ffffff;
            flex-shrink: 0;
            font-size: 0.85rem; /* ensure consistent smaller X across rules */
            padding: 3px; /* slightly reduced padding */
            background: rgba(255,255,255,0.08);
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px; /* ensure duplicate rule matches new smaller size */
            height: 26px;
        }

        /* Ensure the X icon is perfectly centered in its circular background */
        .attachment-chip button i {
            margin: 0;
            display: inline-block;
            line-height: 1;
            font-size: 14px; /* increased icon size for a slightly larger X */
            width: 100%;
            text-align: center;
            vertical-align: middle;
        }

        #drop-zone {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 4px dashed #475569;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        /* Hide webkit scrollbar for the horizontal file preview */
        #file-preview::-webkit-scrollbar { display: none; }

        /* Make the message textbox occupy full horizontal space:
           - allow the textarea to use the full flex width
           - reserve space on the right with padding so the send button can overlay
           - reserve space on the left for the file button (which is positioned absolutely)
           - position the send and file buttons absolutely to avoid consuming layout width */
        #chat-form {
            position: relative;
            width: 100%;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .flex-grow {
            flex: 1 1 100%;
            min-width: 0;
        }
        /* textarea reserves space on the right for send and on the left for the file button,
           so its visible text area touches the chat edge visually */
        #user-input {
            width: 100%;
            padding-right: 72px; /* reserve space for send button overlay */
            padding-left: 18px;  /* reserve space for file button on the left (moved slightly left) */
            box-sizing: border-box;
            height: 96px !important; /* increased fixed input height for more vertical space */
            padding-top: 12px; /* reduced top padding so the placeholder and first line sit higher */
            padding-bottom: 16px;
            overflow: auto; /* allow internal scrolling when content exceeds the fixed height */
            /* ensure text and placeholder are strictly left-aligned at the start */
            text-align: left !important;
            display: block !important;
            /* slightly lighter near-black input background for improved contrast */
            background: #1f1f23 !important; /* slightly lighter near-black (made a bit lighter) */
            color: #e6eef6 !important;                       /* exact code block text color */
            border: 1px solid rgba(148,163,184,0.08) !important; /* subtle outline around input */
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(148,163,184,0.02) inset !important; /* soft inner outline for depth */
            resize: none !important; /* prevent user resize */
        }
        /* placeholder color to visually match code block text and ensure it is left-aligned at the start of the input */
        #user-input::placeholder {
            color: #e6eef6 !important;
            opacity: 0.84;
            /* explicitly ensure placeholder text aligns to the start/left of the textarea */
            text-align: left !important;
        }

        /* ensure focus states from utility classes don't reintroduce outlines */
        #user-input:focus, #user-input:active {
            outline: none !important;
            box-shadow: none !important;
            border: none !important;
        }
        /* send button stays on the right as before */
        #send-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            margin: 0;
            /* match user's message background color exactly */
            background-color: #4b5563 !important;
            color: white;
            /* default: slightly darker when the user is not typing */
            opacity: 0.86;
            filter: brightness(0.92);
            transition: opacity 180ms ease, filter 180ms ease;
            will-change: opacity, filter;
        }
        /* when the user is typing, make the send button appear in its normal, full color */
        #send-btn.typing {
            opacity: 1;
            filter: none;
        }
        /* position the file/upload button absolutely on the left so the textarea can span to the chat edge */
        #chat-form > button[type="button"] {
            position: absolute;
            left: 6px;
            bottom: 6px;
            z-index: 11;
            padding: 8px;
            background: transparent;
            border: none;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="flex flex-col">
    <div id="user-avatar" title="You" aria-hidden="false" style="display: none;"></div>

    <!-- Full-screen initial loading splash -->
    <div id="initial-loader" aria-hidden="false" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background: #18181b; z-index:9999; transition: opacity 260ms ease;">
        <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; pointer-events:none;">
            <img id="loader-logo" src="/1000096501-removebg-preview (1).png" alt="Logo" style="width:140px; height:140px; object-fit:contain; background:transparent; box-shadow:none; filter:none;">
            <div id="loader-text" style="color:#e6eef6; font-weight:700; font-size:1.05rem; opacity:0.95;">Carregando...</div>
        </div>
    </div>

    <!-- Top bar across the top for title / visual bar (full width) - now solid, same color as chat background -->
    <div id="top-title" aria-hidden="false" style="position:fixed; top:0; left:0; right:0; width:100%; height:40px; z-index:119; pointer-events:none; display:flex; padding:8px 16px; background: #18181b; color:#e2e8f0; font-weight:700; font-size:0.95rem; text-align:center; border-bottom: none; align-items:center; justify-content:center;">
        <!-- Container for navigation actions (Back to List) -->
        <div id="nav-actions-left" style="position:absolute; left:8px; top:50%; transform:translateY(-50%); display:flex; gap:4px; z-index:122; pointer-events:auto;"></div>
        
        <span id="top-title-text" aria-hidden="false" style="display:inline-block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(100% - 80px);"></span>

        <!-- Container for session actions (New Chat) -->
        <div id="nav-actions-right" style="position:absolute; right:48px; top:50%; transform:translateY(-50%); display:flex; gap:4px; z-index:122; pointer-events:auto;"></div>
    </div>
    <style>
        /* Quick typing caret for generated chat title */
        #top-title-text.typing-title {
            position: relative;
        }
        #top-title-text.typing-title::after {
            content: '';
            display: inline-block;
            vertical-align: bottom;
            margin-left: 6px;
            width: 2px;
            height: 1em;
            background: #e2e8f0;
            border-radius: 1px;
            animation: title-caret-blink 1s steps(1) infinite;
        }
        @keyframes title-caret-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>



    <!-- Chat List View -->
    <div id="chat-list-view" class="fixed inset-0 bg-[#18181b] z-[150] overflow-y-auto" style="display: none;">
        <div class="p-6 max-w-full mx-auto">
            <div class="flex items-center justify-between mb-8">
                <h1 id="sessions-list-title" class="text-2xl font-bold text-white"></h1>
                <button id="close-list-btn" class="text-slate-400 hover:text-white transition-colors" style="color: #ffffff;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right-icon lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
            <div id="sessions-container" class="space-y-1">
                <!-- Session items will be injected here -->
            </div>
            <!-- Empty state -->
            <div id="empty-sessions" class="text-center py-20 text-slate-500 hidden">
                <p>Nenhuma conversa salva.</p>
                <button id="start-first-chat" class="mt-4 px-6 py-2 bg-zinc-800 text-white rounded-lg hover:bg-zinc-700 transition-colors">Iniciar uma nova conversa</button>
            </div>
        </div>
    </div>

    <main id="chat-window" class="flex-grow overflow-y-auto py-4 flex flex-col space-y-4 custom-scrollbar chat-container" style="padding-bottom:120px;">

    </main>

    <div id="file-preview" style="display: none;"></div>

    <footer class="py-4 bg-transparent" style="position:fixed; left:0; right:0; bottom:0; z-index:118; backdrop-filter: none; box-shadow: none; background: transparent;">


        <form id="chat-form" class="flex items-end w-full mx-0 relative">
            <button type="button" onclick="document.getElementById('file-input').click()" class="p-3 bg-transparent text-slate-200 hover:text-white transition-all" title="Upload code">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
            <input type="file" id="file-input" class="hidden" accept=".lua,.txt,.luau,.json,.md,image/*" multiple>
            
            <div class="flex-grow">
                <textarea id="user-input" rows="2" class="w-full bg-transparent border border-zinc-800 text-white rounded-xl py-3 px-4 focus:outline-none resize-none custom-scrollbar" placeholder="Digite sua pergunta ou arraste um arquivo..."></textarea>
            </div>

            <button type="submit" id="send-btn" class="w-10 h-10 flex items-center justify-center bg-blue-600 text-white rounded-full flex-shrink-0 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-icon lucide-arrow-up"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
            </button>
        </form>
    </footer>

    <div id="drop-zone" class="flex flex-col">
        <i class="fas fa-cloud-upload-alt text-6xl text-slate-400 mb-4 animate-bounce"></i>
        <p class="text-xl font-bold text-white">Solte seu arquivo Lua aqui</p>
    </div>

    <style>
        /* subtle fade-out helper for loader */
        #initial-loader.hidden { opacity: 0; pointer-events: none; }

        /* Truncated bubble overlay: centered "Show More" with subtle shadow */
        /* make truncate container positioned so overlays can span full width */
        .bubble-truncate {
            position: relative;
            max-height: 220px; /* default collapsed height */
            overflow: hidden;
        }
        .bubble-truncate.expanded {
            max-height: none;
            overflow: visible;
        }
        .show-more-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none; /* allow button to handle clicks */
        }
        /* expand the shadow so it sits flush with the bubble edges and covers the full horizontal background */
        .show-more-shadow {
            position: absolute;
            /* extend beyond the bubble padding so the fade covers the full horizontal background */
            left: -12px;
            right: -12px;
            /* drop the gradient slightly below the bubble so the bottom area is visually filled */
            bottom: -8px;
            /* larger height so the fade reaches further down for taller content */
            height: 140px;
            /* gradient fades from transparent to the chat/bubble background color to visually fill the bottom;
               use the page background color (#18181b) for a closer match */
            background: linear-gradient(180deg,
                rgba(24,24,27,0) 0%,
                rgba(24,24,27,0.35) 40%,
                rgba(24,24,27,0.6) 70%,
                #18181b 100%);
            pointer-events: none;
            /* keep square corners so it lines up with bubble edges when extended */
            border-radius: 0;
            z-index: 1; /* keep shadow beneath the button */
            box-shadow: none;
        }
        .show-more-btn {
            pointer-events: auto;
            margin-bottom: 18px; /* lift the button above the shadow */
            background: transparent; /* removed visible background */
            color: #ffffff !important; /* force fully white text */
            border: none; /* removed border to keep it background-less */
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            backdrop-filter: none; /* no blur behind button */
            cursor: pointer;
            box-shadow: none; /* remove shadow */
            opacity: 1 !important; /* ensure no transparency affects color */
            position: relative;
            z-index: 2; /* ensure button renders above the shadow */
        }
        /* when collapsed show subtle outline */
        .bubble-truncate:not(.expanded) .show-more-btn { display: inline-block; color: #ffffff !important; opacity: 1 !important; }
        .bubble-truncate.expanded .show-more-btn { display: none; }
    </style>

    <script type="module" src="profile.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
